[project]
name = "fake-agent"
version = "0.1.0"
description = "Test-only scripted InteractiveAgent plugin and REPL for Shikiru's contract test kit (04 §3, 07 §3)."
requires-python = ">=3.14"
dependencies = ["shikiru"]

[project.scripts]
fake-agent-repl = "fake_agent.repl:main"

[project.entry-points."shikiru.agents"]
fake = "fake_agent.agent:create"

[tool.uv.sources]
shikiru = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fake_agent"]
