name: Bug report
description: Report a problem with Shikiru
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not paste secrets or private project content. State files, prompts and reports can contain
        it; redact before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `shikiru --version` and `shikiru doctor`, and your operating system.
    validations:
      required: true
