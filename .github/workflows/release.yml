name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release this <major>.<minor>.<patch> version instead of the proposed one"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Propose the version of the newest green commit on main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.propose.outputs.version }}
      sha: ${{ steps.propose.outputs.sha }}
    env:
      BRANCH: ${{ github.ref_name }}
      REQUESTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Propose the version of the newest green commit
        id: propose
        run: |
          if [[ "$BRANCH" != main ]]; then
            echo "::error::release from main; this run is on $BRANCH" >&2
            exit 1
          fi
          sha="$(gh run list --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [[ -z "$sha" ]]; then
            echo "::error::CI has not passed on main" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on origin/main" >&2
            exit 1
          fi
          arguments=(--commit "$sha")
          if [[ -n "$REQUESTED_VERSION" ]]; then
            arguments+=(--version "$REQUESTED_VERSION")
          fi
          version="$(python3 scripts/next_version.py "${arguments[@]}")"
          {
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release v$version"
            echo
            echo "Commit: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the distributions
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
      UV_NO_PROGRESS: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false

      - name: Build the distributions
        run: uv build

      - name: Check the build carries the proposed version
        run: |
          if [[ ! -f "dist/shikiru_cli-$VERSION-py3-none-any.whl" ]]; then
            echo "::error::the commit does not build as shikiru-cli $VERSION" >&2
            exit 1
          fi

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github:
    name: Create the GitHub release
    needs: [prepare, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: v${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Write the release notes
        run: |
          python3 scripts/release_notes.py "$TAG" --commit "$SHA" \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${VERSION%%.*}" == "0" ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --target "$SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
