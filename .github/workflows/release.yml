name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  ci-green:
    name: Wait for CI on the tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Wait for CI to pass on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_ci.py "$GITHUB_SHA"

  publish:
    name: Publish the GitHub release
    needs: ci-green
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      UV_NO_PROGRESS: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false

      - name: Check the tag matches the project version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::tag $TAG does not match pyproject.toml version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the distributions
        run: uv build

      - name: Write the checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Write the release notes
        run: |
          python3 scripts/release_notes.py "$TAG" --repo "$GITHUB_REPOSITORY" \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${VERSION%%.*}" == "0" ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
