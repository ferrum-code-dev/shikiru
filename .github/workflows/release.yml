name: Release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release this <major>.<minor>.<patch> version instead of the proposed one"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Propose the version of the newest green commit on main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.propose.outputs.release }}
      version: ${{ steps.propose.outputs.version }}
      sha: ${{ steps.green.outputs.sha }}
    env:
      BRANCH: ${{ github.ref_name }}
      REQUESTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the newest green commit on main
        id: green
        run: |
          if [[ "$BRANCH" != main ]]; then
            echo "::error::release from main; this run is on $BRANCH" >&2
            exit 1
          fi
          sha="$(gh run list --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [[ -z "$sha" ]]; then
            echo "::error::CI has not passed on main" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on origin/main" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the newest green commit
        env:
          SHA: ${{ steps.green.outputs.sha }}
        run: git checkout --detach "$SHA"

      - name: Propose the next version with git-cliff
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          args: --bumped-version

      - name: Choose the version and summarize the run
        id: propose
        env:
          PROPOSED: ${{ steps.cliff.outputs.content }}
          SHA: ${{ steps.green.outputs.sha }}
        run: |
          release=true
          last="$(git for-each-ref --count=1 --sort=-v:refname --format='%(refname:short)' \
            'refs/tags/v[0-9]*.[0-9]*.[0-9]*')"
          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="$(tr -d '[:space:]' <<< "$PROPOSED")"
            version="${version#v}"
            if [[ -z "$version" ]]; then
              echo "::error::git-cliff proposed no version" >&2
              exit 1
            fi
            if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
              release=false
            elif [[ -n "$last" ]] && ! git merge-base --is-ancestor "$last" "$SHA"; then
              release=false
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [[ "$release" == true ]]; then
            {
              echo "## Release v$version"
              echo
              echo "Commit: \`$SHA\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release since $last" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build the distributions
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
      UV_NO_PROGRESS: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false

      - name: Build the distributions
        run: uv build

      - name: Check the build carries the proposed version
        run: |
          if [[ ! -f "dist/shikiru_cli-$VERSION-py3-none-any.whl" ]]; then
            echo "::error::the commit does not build as shikiru-cli $VERSION" >&2
            exit 1
          fi

      - name: Install the wheel in a clean environment and check its version
        run: |
          reported="$(uv run --isolated --no-project \
            --with "dist/shikiru_cli-$VERSION-py3-none-any.whl" shikiru --version)"
          if [[ "$reported" != *"$VERSION"* ]]; then
            echo "::error::the installed wheel reports '$reported', not $VERSION" >&2
            exit 1
          fi

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github:
    name: Create the GitHub release
    needs: [prepare, pypi]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: v${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate the release notes
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          args: --unreleased --tag v${{ needs.prepare.outputs.version }} --strip all

      - name: Save the release notes
        env:
          NOTES: ${{ steps.notes.outputs.content }}
        run: printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
