[project]
name = "shikiru"
version = "0.1.0"
description = "Runs coding-agent tasks in tmux panes, orchestrated by an asyncio engine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "typer>=0.27,<0.28",
  "pydantic>=2.13,<2.14",
  "jinja2>=3.1,<3.2",
  "textual>=6.3,<6.4",
]

[project.scripts]
shikiru = "shikiru.cli.app:app"

[project.entry-points."shikiru.agents"]

[project.entry-points."shikiru.widgets"]
header = "shikiru.plugins.widgets.header:HeaderWidget"
strips = "shikiru.plugins.widgets.strips:StripsWidget"
queue = "shikiru.plugins.widgets.queue:QueueWidget"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shikiru"]

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
  "basedpyright>=1.40,<1.41",
  "import-linter>=2.15,<2.16",
  "vulture>=2.16,<2.17",
  "pytest>=9.1,<9.2",
  "pytest-asyncio>=1.4,<1.5",
  "pytest-timeout>=2.4,<2.5",
  "pytest-cov>=7.1,<7.2",
  "pytest-xdist>=3.8,<3.9",
  "poethepoet>=0.48,<0.49",
  "fake-agent",
]

[tool.uv.workspace]
members = ["tests/fake_agent"]

[tool.uv.sources]
fake-agent = { workspace = true }

[tool.poe.tasks]
format-check = "ruff format --check ."
lint = "ruff check ."
imports = "lint-imports"
types = "basedpyright"
dead-code = "vulture"
test = "pytest -m 'not e2e'"
e2e = "pytest -m e2e --no-cov"

[tool.poe.tasks.fix]
sequence = [
  { cmd = "ruff format ." },
  { cmd = "ruff check --fix ." },
]

[tool.poe.tasks.check]
sequence = ["format-check", "lint", "imports", "types", "dead-code", "test"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001", # AGENTS.md: no comments in code; no per-file copyright headers wanted
  "D100",   # AGENTS.md 07 §2.8: docstrings belong on public contracts, not on everything;
  "D101",   # requiring one everywhere turned them into the comments the conventions ban.
  "D102",   # The D2xx/D4xx rules stay on, so the docstrings we do write remain well-formed.
  "D103",
  "D104",
  "D105",
  "D107",
  "D203",   # conflicts with D211 (no blank line before class docstring)
  "D213",   # conflicts with D212 (multi-line docstring summary on first line)
  "COM812", # formatter already governs trailing commas
  "N818",   # CommandFailed is the exact name docs/design/02-architecture.md §2 gives this error
  "PLR0913", # SubprocessRunner.run and similar boundary calls need argv/timeout/cwd/env/input/check
  "ASYNC109", # our injected Clock/timeout parameters are the project's timeout convention, not asyncio.timeout
  "FBT001", # Typer boolean --flag options are idiomatic positional-looking parameters
  "FBT003", # Typer's typer.Option(False, ...) boolean default is idiomatic, not a bare bool call
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlite3" = { msg = "SQL only in shikiru.store; see 02 §2" }
"subprocess" = { msg = "Subprocesses only via shikiru.process.SubprocessRunner" }
"asyncio.create_subprocess_exec" = { msg = "Subprocesses only via shikiru.process.SubprocessRunner" }
"asyncio.create_subprocess_shell" = { msg = "Subprocesses only via shikiru.process.SubprocessRunner" }
"time.sleep" = { msg = "Time only via shikiru.clock.Clock" }
"asyncio.sleep" = { msg = "Time only via shikiru.clock.Clock" }

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates field annotations at class-definition time, so imports used only as field
# types on these bases are real runtime imports, not typing-only ones.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "shikiru.config.settings.ConfigModel",
  "shikiru.domain.tasks.DomainModel",
]

[tool.ruff.lint.per-file-ignores]
"src/shikiru/domain/steps.py" = ["PLR0911"] # one return per step/outcome match arm (03 §2, §6)
"src/shikiru/agents/contracts.py" = ["PLR0917"] # HeadlessAgent.ask is 04 §1's exact signature
"tests/fake_agent/src/fake_agent/headless.py" = ["ARG002", "PLR0917"] # HeadlessAgent.ask's exact signature (04 §1); the fake ignores every argument but serves canned answers
"src/shikiru/store/**" = ["TID251", "S608"]
"src/shikiru/workspace/**" = ["ASYNC240"] # local worktree filesystem ops, as blocking as sqlite3
"tests/support/git_repo.py" = ["ASYNC240"]
"src/shikiru/process.py" = ["TID251"]
"src/shikiru/clock.py" = ["TID251"]
"src/shikiru/config/loader.py" = ["ANN401"]
"tests/support/waiting.py" = ["TID251"]
"tests/support/store.py" = ["TID251"]
"tests/integration/test_store_database.py" = ["TID251"]
"tests/support/store_reader_process.py" = ["T201"]
"tests/support/store_submit_process.py" = ["T201"]
"tests/**" = ["S101", "D", "ANN", "PLR2004"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "shikiru"

[[tool.importlinter.contracts]]
name = "Layered architecture (02 §2); bootstrap is the composition root and sits outside this contract"
type = "layers"
layers = [
  "(shikiru.cli) | (shikiru.mcp) | (shikiru.dashboard) | (shikiru.agents.testing)",
  "(shikiru.operator)",
  "(shikiru.engine)",
  "(shikiru.workspace) | (shikiru.tmux) | (shikiru.prompts) | (shikiru.helper) | (shikiru.ui) | (shikiru.telemetry) | (shikiru.agents.registry)",
  "(shikiru.store)",
  "(shikiru.domain)",
  "(shikiru.config) : (shikiru.agents.contracts) : (shikiru.agents.sdk)",
  "shikiru.process | shikiru.clock",
  "shikiru.errors",
]

[[tool.importlinter.contracts]]
name = "Engine boundary (AGENTS.md): shikiru.engine imports only shikiru.agents.contracts"
type = "forbidden"
source_modules = ["shikiru.engine"]
forbidden_modules = [
  "shikiru.agents.registry",
  "shikiru.agents.sdk",
  "shikiru.agents.testing",
]

[[tool.importlinter.contracts]]
name = "Widget plugins (02 §2): plugins.widgets imports only dashboard.contract, ui and store.reader"
type = "forbidden"
source_modules = ["shikiru.plugins.widgets"]
forbidden_modules = [
  "shikiru.config.loader",
  "shikiru.store.database",
  "shikiru.store.tasks",
  "shikiru.store.commands",
  "shikiru.store.escalations",
  "shikiru.store.events",
  "shikiru.store.quotas",
  "shikiru.store.runs",
  "shikiru.engine",
  "shikiru.tmux",
  "shikiru.workspace",
  "shikiru.process",
]
allow_indirect_imports = "True"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "e2e: real-agent scenarios excluded from the default gate (poe e2e)",
]
addopts = "-n auto --cov=shikiru --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error"]
testpaths = ["tests"]
timeout = 60

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["shikiru"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
exclude_also = ["if TYPE_CHECKING:"]

[tool.vulture]
paths = ["src/shikiru", "tests"]
min_confidence = 80
