[project]
name = "shikiru"
version = "0.1.0"
description = "Runs coding-agent tasks in tmux panes, orchestrated by an asyncio engine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "typer>=0.27,<0.28",
  "pydantic>=2.13,<2.14",
  "jinja2>=3.1,<3.2",
  "textual>=6.3,<6.4",
  "psutil>=7.0,<8.0",
  "mcp>=1.26,<2.0",
]

[project.scripts]
shikiru = "shikiru.cli.app:app"

[project.entry-points."shikiru.agents"]
claude = "shikiru.plugins.agents.claude.agent:create"
codex = "shikiru.plugins.agents.codex.agent:create"

[project.entry-points."shikiru.widgets"]
header = "shikiru.plugins.widgets.header:HeaderWidget"
escalations = "shikiru.plugins.widgets.escalations:EscalationsWidget"
strips = "shikiru.plugins.widgets.strips:StripsWidget"
queue = "shikiru.plugins.widgets.queue:QueueWidget"
dialogue = "shikiru.plugins.widgets.dialogue:DialogueWidget"
usage = "shikiru.plugins.widgets.usage:UsageWidget"
resources = "shikiru.plugins.widgets.resources:ResourcesWidget"
docker = "shikiru.plugins.widgets.docker:DockerWidget"
disk = "shikiru.plugins.widgets.disk:DiskWidget"
faults = "shikiru.plugins.widgets.faults:FaultsWidget"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shikiru"]

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
  "basedpyright>=1.40,<1.41",
  "import-linter>=2.15,<2.16",
  "vulture>=2.16,<2.17",
  "pytest>=9.1,<9.2",
  "pytest-asyncio>=1.4,<1.5",
  "pytest-timeout>=2.4,<2.5",
  "pytest-cov>=7.1,<7.2",
  "pytest-xdist>=3.8,<3.9",
  "poethepoet>=0.48,<0.49",
  "fake-agent",
]

[tool.uv.workspace]
members = ["tests/fake_agent"]

[tool.uv.sources]
fake-agent = { workspace = true }

[tool.poe.tasks]
format-check = "ruff format --check ."
lint = "ruff check ."
imports = "lint-imports"
types = "basedpyright"
dead-code = "vulture"
soak = "python -m tests.soak"
comments = "python -m tests.support.comment_rule"
literals = "python -m tests.support.literal_rule"
test = "pytest -m 'not e2e'"
e2e = "pytest -m e2e --no-cov -n 0"

[tool.poe.tasks.fix]
sequence = [
  { cmd = "ruff format ." },
  { cmd = "ruff check --fix ." },
]

[tool.poe.tasks.check]
sequence = ["format-check", "lint", "comments", "literals", "imports", "types", "dead-code", "test"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001", # No per-file copyright headers are needed.
  "D100",   # Docstrings belong on public contracts, not on everything;
  "D101",   # requiring one everywhere turned them into the comments the conventions ban.
  "D102",   # The D2xx/D4xx rules stay on, so the docstrings we do write remain well-formed.
  "D103",
  "D104",
  "D105",
  "D107",
  "D203",   # conflicts with D211 (no blank line before class docstring)
  "D213",   # conflicts with D212 (multi-line docstring summary on first line)
  "COM812", # formatter already governs trailing commas
  "N818",   # CommandFailed names the subprocess failure error
  "PLR0913", # SubprocessRunner.run and similar boundary calls need argv/timeout/cwd/env/input/check
  "ASYNC109", # our injected Clock/timeout parameters are the project's timeout convention, not asyncio.timeout
  "FBT001", # Typer boolean --flag options are idiomatic positional-looking parameters
  "FBT003", # Typer's typer.Option(False, ...) boolean default is idiomatic, not a bare bool call
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlite3" = { msg = "SQL only in shikiru.store; see docs/design.md#implementation-boundaries" }
"subprocess" = { msg = "Subprocesses only via shikiru.process.SubprocessRunner" }
"asyncio.create_subprocess_exec" = { msg = "Subprocesses only via shikiru.process.SubprocessRunner" }
"asyncio.create_subprocess_shell" = { msg = "Subprocesses only via shikiru.process.SubprocessRunner" }
"time.sleep" = { msg = "Time only via shikiru.clock.Clock" }
"asyncio.sleep" = { msg = "Time only via shikiru.clock.Clock" }
"time.time" = { msg = "Time only via shikiru.clock.Clock" }
"time.time_ns" = { msg = "Time only via shikiru.clock.Clock" }
"time.monotonic" = { msg = "Time only via shikiru.clock.Clock" }
"time.monotonic_ns" = { msg = "Time only via shikiru.clock.Clock" }
"time.perf_counter" = { msg = "Time only via shikiru.clock.Clock" }
"time.perf_counter_ns" = { msg = "Time only via shikiru.clock.Clock" }
"time.process_time" = { msg = "Time only via shikiru.clock.Clock" }
"time.process_time_ns" = { msg = "Time only via shikiru.clock.Clock" }
"time.thread_time" = { msg = "Time only via shikiru.clock.Clock" }
"time.thread_time_ns" = { msg = "Time only via shikiru.clock.Clock" }
"datetime.datetime.now" = { msg = "Time only via shikiru.clock.Clock" }
"datetime.datetime.utcnow" = { msg = "Time only via shikiru.clock.Clock" }
"datetime.datetime.today" = { msg = "Time only via shikiru.clock.Clock" }
"datetime.date.today" = { msg = "Time only via shikiru.clock.Clock" }

[tool.ruff.lint.flake8-type-checking]
# pydantic evaluates field annotations at class-definition time, so imports used only as field
# types on these bases are real runtime imports, not typing-only ones.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "shikiru.config.settings.ConfigModel",
  "shikiru.domain.tasks.DomainModel",
]
runtime-evaluated-decorators = [
  "typer.Typer.command",
  "typer.Typer.callback",
  "mcp.server.fastmcp.FastMCP.tool",
]

[tool.ruff.lint.per-file-ignores]
"src/shikiru/domain/steps.py" = ["PLR0911"] # one return per step/outcome match arm (docs/design.md#task-flow-and-recovery)
"src/shikiru/mcp/server.py" = ["TC001"] # FastMCP inspects registered tool annotations at runtime
"src/shikiru/cli/view.py" = ["TC001"] # typer resolves the Role argument annotation at runtime
"src/shikiru/agents/contracts.py" = ["PLR0917"] # HeadlessAgent.ask is the agent contract's exact signature
"tests/fake_agent/src/fake_agent/headless.py" = ["ARG002", "PLR0917"] # HeadlessAgent.ask's exact signature; the fake ignores every argument but serves canned answers
"src/shikiru/plugins/agents/claude/headless.py" = ["PLR0917"] # HeadlessAgent.ask's exact signature
"src/shikiru/plugins/agents/codex/headless.py" = ["PLR0917"] # HeadlessAgent.ask's exact signature
"src/shikiru/store/**" = ["S608"]
"src/shikiru/workspace/**" = ["ASYNC240"] # local worktree filesystem ops, as blocking as sqlite3
"tests/support/git_repo.py" = ["ASYNC240"]
"src/shikiru/process.py" = ["TID251"]
"src/shikiru/clock.py" = ["TID251"]
"src/shikiru/config/loader.py" = ["ANN401"]
"tests/support/waiting.py" = ["TID251"]
"tests/support/store.py" = ["TID251"]
"tests/integration/test_store_database.py" = ["TID251"]
"tests/support/store_reader_process.py" = ["T201"]
"tests/support/store_submit_process.py" = ["T201"]
"tests/soak/**" = ["S311", "PLR0911", "PLR0917"] # a seeded generator is the point of the soak; one return per match arm
"tests/**" = ["S101", "D", "ANN", "PLR2004"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "shikiru"

[[tool.importlinter.contracts]]
name = "Layered architecture (docs/design.md#implementation-boundaries); bootstrap is the composition root and sits outside this contract"
type = "layers"
layers = [
  "(shikiru.cli) | (shikiru.mcp) | (shikiru.dashboard) | (shikiru.agents.testing)",
  "(shikiru.operator)",
  "(shikiru.engine)",
  "(shikiru.workspace) | (shikiru.tmux) | (shikiru.prompts) | (shikiru.helper) | (shikiru.ui) | (shikiru.telemetry) | (shikiru.agents.registry)",
  "(shikiru.store)",
  "(shikiru.domain)",
  "(shikiru.config) : (shikiru.agents.contracts) : (shikiru.agents.sdk) : (shikiru.agents.settings)",
  "shikiru.process | shikiru.clock",
  "shikiru.errors | shikiru.palette",
]

[[tool.importlinter.contracts]]
name = "Engine boundary (docs/design.md#implementation-boundaries): engine agent imports stay on the shared contract"
type = "forbidden"
source_modules = ["shikiru.engine"]
forbidden_modules = [
  "shikiru.agents.registry",
  "shikiru.agents.sdk",
  "shikiru.agents.settings",
  "shikiru.agents.testing",
]

[[tool.importlinter.contracts]]
name = "Widget plugins (docs/design.md#implementation-boundaries): plugins.widgets imports only shikiru.dashboard.contract and shikiru.ui"
type = "forbidden"
source_modules = ["shikiru.plugins.widgets"]
forbidden_modules = [
  "shikiru.__main__",
  "shikiru.agents",
  "shikiru.bootstrap",
  "shikiru.cli",
  "shikiru.clock",
  "shikiru.config",
  "shikiru.dashboard.actions_list",
  "shikiru.dashboard.activity",
  "shikiru.dashboard.app",
  "shikiru.dashboard.covered",
  "shikiru.dashboard.blocker_evidence",
  "shikiru.dashboard.blocker_rows",
  "shikiru.dashboard.briefing_view",
  "shikiru.dashboard.diagnostics",
  "shikiru.dashboard.diagnostics_sections",
  "shikiru.dashboard.detail",
  "shikiru.dashboard.detail_fold",
  "shikiru.dashboard.detail_hint",
  "shikiru.dashboard.details_list",
  "shikiru.dashboard.details_list_view",
  "shikiru.dashboard.evidence_table",
  "shikiru.dashboard.extra_details",
  "shikiru.dashboard.fault_guidance",
  "shikiru.dashboard.fold_bodies",
  "shikiru.dashboard.help_keys",
  "shikiru.dashboard.help_screen",
  "shikiru.dashboard.interaction",
  "shikiru.dashboard.ladder_editor",
  "shikiru.dashboard.live_settings",
  "shikiru.dashboard.motion",
  "shikiru.dashboard.orchestration_fields",
  "shikiru.dashboard.palette",
  "shikiru.dashboard.palette_app",
  "shikiru.dashboard.palette_drafts",
  "shikiru.dashboard.resolution",
  "shikiru.dashboard.resolution_view",
  "shikiru.dashboard.row_list",
  "shikiru.dashboard.section_rows",
  "shikiru.dashboard.services",
  "shikiru.dashboard.session_picker",
  "shikiru.dashboard.session_history",
  "shikiru.dashboard.task_picker",
  "shikiru.dashboard.tick",
  "shikiru.dashboard.timeline_filter",
  "shikiru.dashboard.timeline_section",
  "shikiru.dashboard.usage_body",
  "shikiru.dashboard.views",
  "shikiru.dashboard.wizard",
  "shikiru.domain",
  "shikiru.engine",
  "shikiru.errors",
  "shikiru.helper",
  "shikiru.mcp",
  "shikiru.operator",
  "shikiru.paths",
  "shikiru.palette",
  "shikiru.plugins.agents",
  "shikiru.private",
  "shikiru.process",
  "shikiru.prompts",
  "shikiru.store",
  "shikiru.telemetry",
  "shikiru.tmux",
  "shikiru.view_log",
  "shikiru.workspace",
]
allow_indirect_imports = "True"

[[tool.importlinter.contracts]]
name = "Agent plugins (docs/design.md#agent-contract): plugins.agents imports only agents.contracts, agents.sdk, agents.settings, process, clock and errors"
type = "forbidden"
source_modules = ["shikiru.plugins.agents"]
forbidden_modules = [
  "shikiru.bootstrap",
  "shikiru.cli",
  "shikiru.mcp",
  "shikiru.dashboard",
  "shikiru.operator",
  "shikiru.engine",
  "shikiru.workspace",
  "shikiru.tmux",
  "shikiru.prompts",
  "shikiru.helper",
  "shikiru.ui",
  "shikiru.telemetry",
  "shikiru.store",
  "shikiru.domain",
  "shikiru.config",
  "shikiru.paths",
  "shikiru.palette",
  "shikiru.private",
  "shikiru.view_log",
  "shikiru.__main__",
  "shikiru.agents.registry",
  "shikiru.agents.testing",
  "shikiru.plugins.widgets",
]
allow_indirect_imports = "True"

[[tool.importlinter.contracts]]
name = "Agent plugins (docs/design.md#agent-contract): the Claude and Codex plugins do not import each other"
type = "independence"
modules = ["shikiru.plugins.agents.claude", "shikiru.plugins.agents.codex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "e2e: real-agent scenarios excluded from the default gate (poe e2e)",
  "real_e2e: real Claude and Codex scenarios requiring SHIKIRU_E2E=1",
]
addopts = "-n auto --cov=shikiru --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error"]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
timeout = 60
tmp_path_retention_policy = "failed"

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["shikiru"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
exclude_also = ["if TYPE_CHECKING:"]

[tool.vulture]
paths = ["src/shikiru", "tests"]
min_confidence = 80
