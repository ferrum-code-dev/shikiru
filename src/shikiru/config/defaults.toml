[project]
trackers = []

[sessions]
ssh_timeout_seconds = 30

[orchestration]
max_parallel = 2
max_iterations = 5
integration = "merge"
poll_seconds = 2

[orchestration.resources]
max_cpu_pct = 85
min_free_ram_gb = 4
sample_seconds = 2
cpu_window_seconds = 30

[orchestration.timeouts]
stall = 1200
tool = 7200
max_quota_wait = 28800
integration_wait = 1800
pr_wait = 604800
helper = 300

[orchestration.faults]
backoff_initial_seconds = 2
backoff_max_seconds = 60
unexpected_fault_limit = 10
stop_notify_seconds = 30
repeat_notify_seconds = 300

[orchestration.network]
fetch_timeout_seconds = 30
pr_close_attempts = 5

[roles.implementer]
escalate_after = 2

[dashboard]
widgets = ["header", "escalations", "strips", "queue", "dialogue", "usage", "resources", "docker"]
animations = true
docker_refresh_seconds = 5
docker_timeout_seconds = 5
repo_status_cache_seconds = 10

[dashboard.motion]
refresh_hz = 4
stream_active_seconds = 10
stamp_flash_milliseconds = 400
escalation_pulse_hz = 1
task_event_limit = 50
merge_event_limit = 20

[dashboard.layout]
split = "h"
panes = [
  { pane = "system", size = 30 },
  { split = "v", panes = [ { pane = "leader" }, { pane = "implementer" }, { pane = "shell", size = 20 } ] },
]

[dashboard.titles]
window = "{task_id} {title:.24}"
leader = "{glyph} Leader · {agent}:{model}/{effort} · iter {iteration} · ctx {context} · {cost} {flags}"
implementer = "{glyph} Implementer · {agent}:{model}/{effort} · iter {iteration} · ctx {context} · {cost} {flags}"
system = "Shikiru · {project} · {active}/{max_parallel} active · {queued} queued"
shell = "Shell · {cwd}"

[notify]
command = ""
timeout_seconds = 30

[logging]
engine_log_max_bytes = 10485760
engine_log_backups = 3

[doctor]
probe_timeout = 180
probe_stream_tail_lines = 20
