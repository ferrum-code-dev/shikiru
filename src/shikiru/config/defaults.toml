[project]
trackers = []

[sessions]
ssh_timeout_seconds = 30

[orchestration]
max_parallel = 2
max_iterations = 5
integration = "merge"
poll_seconds = 2
shutdown_seconds = 15
dispatch_budget_seconds = 10

[orchestration.resources]
max_cpu_pct = 85
min_free_ram_gb = 4
sample_seconds = 2
cpu_window_seconds = 30

[orchestration.timeouts]
stall = 1200
tool = 7200
max_quota_wait = 28800
integration_wait = 1800
pr_wait = 604800
helper = 300
cache_copy = 600
git_command = 120

[orchestration.faults]
backoff_initial_seconds = 2
backoff_max_seconds = 60
unexpected_fault_limit = 10
stop_notify_seconds = 30
repeat_notify_seconds = 300

[orchestration.network]
fetch_timeout_seconds = 30
poll_attempts = 8
pr_poll_seconds = 300
pr_close_attempts = 5

[roles.implementer]
escalate_after = 2

[dashboard]
widgets = ["header", "escalations", "strips", "queue", "dialogue", "usage", "resources", "docker", "disk", "faults"]
animations = true
docker_refresh_seconds = 5
docker_timeout_seconds = 5
docker_scope = "project"
disk_refresh_seconds = 60
disk_size_refresh_seconds = 300
disk_warn_free_pct = 10
disk_alert_free_pct = 5
repo_status_cache_seconds = 10
timeline_page_size = 20
timeline_scan_rows = 256
timeline_refresh_seconds = 1
recent_task_limit = 30
recent_task_window = 3

[dashboard.motion]
refresh_hz = 4
stamp_flash_milliseconds = 400
escalation_pulse_hz = 1
task_event_limit = 50
merge_event_limit = 20

[dashboard.layout]
split = "v"
panes = [
  { pane = "leader", size = 40 },
  { pane = "implementer", size = 40 },
  { pane = "shell", size = 20 },
]

[dashboard.titles]
window = "{task_id} {title:.24}"
leader = "{role_label} · {agent}:{model}/{effort} · iter {iteration} · ctx {context} · {cost} {flags_text}"
implementer = "{role_label} · {agent}:{model}/{effort} · iter {iteration} · ctx {context} · {cost} {flags_text}"
system = "Shikiru · {project} · {active}/{max_parallel} active · {queued} queued"
shell = "Project folder · {cwd}"
context_warn_pct = 40
context_alert_pct = 60

[dashboard.gauges]
quota_warn_pct = 50
quota_alert_pct = 90

[notify]
command = ""
timeout_seconds = 30

[logging]
engine_log_max_bytes = 10485760
engine_log_backups = 3

[doctor]
probe_timeout = 180
probe_stream_tail_lines = 20

[retention]
interval_seconds = 3600
finished_task_days = 30
event_days = 90
command_days = 30
